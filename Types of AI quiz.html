<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Types of AI - Student Quiz</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
    background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:Segoe UI,sans-serif;
}
.quiz-card{
    width:700px;
    max-width:95%;
    border-radius:20px;
    padding:35px;
    background:#fff;
    box-shadow:0 15px 40px rgba(0,0,0,.3);
}
.option{
    border:2px solid #ddd;
    border-radius:10px;
    padding:14px;
    margin-top:12px;
    cursor:pointer;
    transition:.3s;
}
.option:hover{
    background:#f8f9fa;
    border-color:#0d6efd;
}
.correct{
    background:#d1e7dd!important;
    border-color:#198754!important;
}
.wrong{
    background:#f8d7da!important;
    border-color:#dc3545!important;
}
#feedback{
    display:none;
    margin-top:20px;
    font-size:18px;
    font-weight:bold;
}
#nextBtn{
    display:none;
}
</style>

</head>
<body>

<div class="quiz-card">

<h3 class="text-primary mb-4">🧠 Student Interaction Quiz</h3>

<h5 id="question"></h5>

<div id="options"></div>

<div id="feedback"></div>

<div class="text-end mt-4">
<button id="nextBtn" class="btn btn-primary">
Next →
</button>
</div>

</div>

<script>

const quiz=[

{
question:"1. Which AI is designed to perform only one specific task?",
options:[
"General AI",
"Narrow AI",
"Superintelligence",
"Robotics"
],
answer:1
},

{
question:"2. Which AI is still hypothetical and can perform many human-like tasks?",
options:[
"Narrow AI",
"General AI (AGI)",
"Expert System",
"Machine Learning"
],
answer:1
},

{
question:"3. Which AI is only a theoretical concept today?",
options:[
"Narrow AI",
"General AI",
"Superintelligence (ASI)",
"Chatbot"
],
answer:2
},

{
question:"4. Which AI is used in medical image diagnosis?",
options:[
"Narrow AI",
"General AI",
"Superintelligence",
"None"
],
answer:0
},

{
question:"5. Steve Wozniak's Coffee Test is used to evaluate?",
options:[
"Narrow AI",
"General AI",
"Superintelligence",
"Computer Vision"
],
answer:1
},

{
question:"6. Which technology helps self-driving cars detect surroundings?",
options:[
"Bluetooth",
"Wi-Fi",
"LiDAR",
"NFC"
],
answer:2
},

{
question:"7. Which AI can transfer knowledge from one task to another?",
options:[
"Narrow AI",
"General AI",
"Chatbot",
"Rule-Based AI"
],
answer:1
},

{
question:"8. Which type of AI is widely used today?",
options:[
"General AI",
"Superintelligence",
"Narrow AI",
"Quantum AI"
],
answer:2
}

];

let current=0;

const q=document.getElementById("question");
const opt=document.getElementById("options");
const fb=document.getElementById("feedback");
const next=document.getElementById("nextBtn");

function loadQuestion(){

fb.style.display="none";
next.style.display="none";

q.innerHTML=quiz[current].question;

opt.innerHTML="";

quiz[current].options.forEach((item,index)=>{

let div=document.createElement("div");
div.className="option";
div.innerHTML=item;

div.onclick=function(){

if(opt.classList.contains("answered")) return;

opt.classList.add("answered");

let all=document.querySelectorAll(".option");

all.forEach(x=>x.style.pointerEvents="none");

if(index===quiz[current].answer){

div.classList.add("correct");

fb.innerHTML="✅ Correct!";
fb.style.color="green";

}else{

div.classList.add("wrong");

all[quiz[current].answer].classList.add("correct");

fb.innerHTML="❌ Wrong! <br><small>Correct Answer: <b>"+quiz[current].options[quiz[current].answer]+"</b></small>";

fb.style.color="red";

}

fb.style.display="block";

next.style.display="inline-block";

};

opt.appendChild(div);

});

opt.classList.remove("answered");

}

next.onclick=function(){

current++;

if(current<quiz.length){

loadQuestion();

}else{

document.querySelector(".quiz-card").innerHTML=`
<h2 class="text-success text-center">🎉 Quiz Completed</h2>
<p class="text-center">Thank You!</p>
`;

}

};

loadQuestion();

</script>

</body>
</html>
