<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI & Machine Learning Quiz</title>
    <style>
        :root {
    --primary: #4f46e5;
    --primary-hover: #4338ca;
    --success: #22c55e;
    --danger: #ef4444;
    --bg: #f8fafc;
    --card-bg: #ffffff;
    --text: #1e293b;
    --border: #e2e8f0;
}

body {
    font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    background-color: var(--bg);
    color: var(--text);
    margin: 0;
    padding: 10px;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    box-sizing: border-box;
    overflow: hidden; /* Prevents body scroll entirely */
}

.quiz-container {
    background: var(--card-bg);
    max-width: 540px;
    width: 100%;
    max-height: 95vh; /* Constraints container size */
    border-radius: 16px;
    box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
    padding: 20px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
}

.progress {
    font-size: 0.75rem;
    color: #64748b;
    margin-bottom: 8px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
}

.quiz-image {
    width: 100%;
    height: 140px; /* Reduced from 220px to save vertical room */
    object-fit: cover;
    border-radius: 8px;
    margin-bottom: 12px;
    border: 1px solid var(--border);
}

h2 {
    font-size: 1.05rem;
    margin-top: 0;
    margin-bottom: 12px;
    line-height: 1.4;
}

.options-list {
    display: flex;
    flex-direction: column;
    gap: 8px; /* Snugger gaps */
    margin-bottom: 0px;
}

.option-btn {
    background: var(--card-bg);
    border: 1.5px solid var(--border);
    border-radius: 8px;
    padding: 10px 16px; /* Reduced vertical padding */
    text-align: left;
    font-size: 0.95rem;
    cursor: pointer;
    transition: all 0.15s ease;
    font-weight: 500;
    color: var(--text);
    width: 100%;
}

.option-btn:hover:not([disabled]) {
    border-color: var(--primary);
    background-color: #f5f3ff;
}

.option-btn[disabled] {
    cursor: not-allowed;
}

.option-btn.correct {
    background-color: #dcfce7;
    border-color: var(--success);
    color: #14532d;
}

.option-btn.wrong {
    background-color: #fee2e2;
    border-color: var(--danger);
    color: #7f1d1d;
}

.feedback-box {
    margin-top: 12px;
    padding: 12px;
    border-radius: 8px;
    display: none;
    animation: fadeIn 0.2s ease;
}

.feedback-box.correct-style {
    background-color: #f0fdf4;
    border-left: 4px solid var(--success);
}

.feedback-box.wrong-style {
    background-color: #fef2f2;
    border-left: 4px solid var(--danger);
}

.feedback-title {
    font-weight: 700;
    font-size: 0.95rem;
    margin-bottom: 4px;
}

.feedback-box.correct-style .feedback-title { color: var(--success); }
.feedback-box.wrong-style .feedback-title { color: var(--danger); }

.explanation {
    font-size: 0.85rem;
    color: #334155;
    margin-bottom: 0px;
    line-height: 1.35;
}

.did-you-know {
    font-size: 0.8rem;
    color: #475569;
    background: #f1f5f9;
    padding: 6px 10px;
    border-radius: 6px;
    font-style: italic;
    margin-top: 6px;
}

.next-btn {
    display: none;
    width: 100%;
    background-color: var(--primary);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 12px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    margin-top: 12px;
    transition: background 0.2s;
}

.next-btn:hover {
    background-color: var(--primary-hover);
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(3px); }
    to { opacity: 1; transform: translateY(0); }
}
    </style>
</head>
<body>

<div class="quiz-container">
    <div class="progress" id="progress">Question 1 of 10</div>
    
    <img src="" alt="Quiz Visual" class="quiz-image" id="quiz-img">

    <h2 id="question-text">Question loading...</h2>

    <div class="options-list" id="options-container"></div>

    <div class="feedback-box" id="feedback-box">
        <div class="feedback-title" id="feedback-title"></div>
        <div class="explanation" id="explanation-text"></div>
        <div class="did-you-know" id="dyn-box" style="display: none;"></div>
    </div>

    <button class="next-btn" id="next-btn" onclick="nextQuestion()">Next Question →</button>
</div>

<script>
    const quizData = [
        {
            imageUrl: "https://images.unsplash.com/photo-1527474305487-b87b222841cc?auto=format&fit=crop&w=600&q=80", // Robot playing chess/thinking
            question: "Which technology allows a robot to make intelligent decisions during a complex chess game?",
            options: ["Artificial Intelligence", "Hardcoded Scripting", "Cloud Storage", "Rule-Based Database"],
            correct: 0,
            explanation: "AI enables machines to mimic human thinking, evaluate thousands of prospective moves, and handle real-time decision-making.",
            dyn: "In 1997, IBM's Deep Blue defeated World Chess Champion Garry Kasparov."
        },
        {
            imageUrl: "https://images.unsplash.com/photo-1557200134-90327ee9fafa?auto=format&fit=crop&w=600&q=80", // Email/Inbox concept
            question: "How does Gmail intelligently categorize an email as spam before it reaches your inbox?",
            options: ["It guesses randomly", "Machine Learning", "Static Filtering Rules", "Heuristic Pattern Matching"],
            correct: 1,
            explanation: "Gmail trains ML models on millions of labeled emails to recognize shifting spam signals dynamically."
        },
        {
            imageUrl: "https://images.unsplash.com/photo-1543512214-318c7553f230?auto=format&fit=crop&w=600&q=80", // Smart Speaker / Audio wave
            question: "Which technology helps voice assistants like Alexa accurately process and understand natural human speech?",
            options: ["Signal Modulation", "Deep Learning", "Relational Database Parsing", "Linear Regression Trees"],
            correct: 1,
            explanation: "Deep Learning uses multi-layered neural networks to accurately map audio waves into speech text."
        },
        {
            imageUrl: "https://images.unsplash.com/photo-1619546813926-a78fa6372cd2?auto=format&fit=crop&w=600&q=80", // Apples and Bananas
            question: "Imagine you feed a system 5,000 Apple images and 5,000 Banana images, each labeled with its explicit name. What type of learning is this?",
            options: ["Supervised Learning", "Reinforcement Learning", "Unsupervised Learning", "Evolutionary Learning"],
            correct: 0,
            explanation: "Supervised learning uses datasets that are pre-labeled with correct mapping pairs so the algorithm can learn the relationship."
        },
        {
            imageUrl: "https://images.unsplash.com/photo-1551288049-bebda4e38f71?auto=format&fit=crop&w=600&q=80", // Data graphs/clustering
            question: "A system receives thousands of customer purchase records without any labels and categorizes similar customers together. Which method is used?",
            options: ["Unsupervised Learning", "Supervised Learning", "Deep Q-Learning", "Supervised Classification"],
            correct: 0,
            explanation: "Unsupervised learning identifies hidden patterns, structures, or natural clusters within completely unlabeled data data clusters."
        },
        {
            imageUrl: "https://images.unsplash.com/photo-1485827404703-89b55fcc595e?auto=format&fit=crop&w=600&q=80", // Robot balancing/walking
            question: "A robot falls down many times but slowly learns to walk and stabilize balance by receiving system scores and rewards. Which technique is this?",
            options: ["Reinforcement Learning", "Supervised Learning", "Unsupervised Clustering", "Feature Engineering"],
            correct: 0,
            explanation: "Reinforcement learning optimizes an agent's policy based on maximizing dynamic trial-and-error environmental rewards."
        },
        {
            imageUrl: "https://images.unsplash.com/photo-1576091160399-112ba8d25d1d?auto=format&fit=crop&w=600&q=80", // Medical X-Ray / Doctor
            question: "A medical software detects early-stage cancer cells from complex X-ray images. Which technology is MOST suitable?",
            options: ["Deep Learning", "Spreadsheet Automation", "Natural Language Processing", "Deterministic Computing"],
            correct: 0,
            explanation: "Medical imaging contains complex visual abstractions that Convolutional Neural Networks (Deep Learning) learn automatically."
        },
        {
            imageUrl: "https://images.unsplash.com/photo-1595079676339-1534801ad6cf?auto=format&fit=crop&w=600&q=80", // Digital transaction / Security
            question: "When you scan a QR code, which underlying technology helps banking mainframes spot highly suspicious fraud attempts instantly?",
            options: ["AI & Machine Learning", "Encrypted Tunneling", "Mesh Networking Protocols", "Peripheral Data Transfer"],
            correct: 0,
            explanation: "AI and Machine learning models process risk scores on transaction parameters in milliseconds to catch real-time anomalies."
        },
        {
            imageUrl: "https://images.unsplash.com/photo-1509228468518-180dd4864904?auto=format&fit=crop&w=600&q=80", // Mathematics/Venn diagram concept
            question: "Regarding the structural architecture of Artificial Intelligence, which structural mathematical nesting notation statement is TRUE?",
            options: ["AI ⊃ ML ⊃ DL (AI contains ML, which contains DL)", "DL contains AI", "ML encompasses AI completely", "AI is a subset of DL"],
            correct: 0,
            explanation: "Machine Learning is a specialized subfield within Artificial Intelligence, and Deep Learning is a further subset of Machine Learning."
        },
        {
            imageUrl: "https://images.unsplash.com/photo-1592417817098-8f3d6eb19675?auto=format&fit=crop&w=600&q=80", // Leaves/Agriculture inspection
            question: "An agricultural mobile application identifies specific crop diseases instantly from a smartphone photo. Which tech stack is responsible?",
            options: ["Deep Learning", "Markup Rendering Engine", "Dynamic Presentation Software", "Relational Arithmetic Engines"],
            correct: 0,
            explanation: "Deep Learning structures handle computer vision exceptionally well, extracting pixel patterns to classify disease markers."
        }
    ];

    let currentQuestionIndex = 0;

    const progressEl = document.getElementById("progress");
    const quizImgEl = document.getElementById("quiz-img");
    const questionTextEl = document.getElementById("question-text");
    const optionsContainer = document.getElementById("options-container");
    const feedbackBox = document.getElementById("feedback-box");
    const feedbackTitle = document.getElementById("feedback-title");
    const explanationText = document.getElementById("explanation-text");
    const dynBox = document.getElementById("dyn-box");
    const nextBtn = document.getElementById("next-btn");

    function loadQuestion() {
        feedbackBox.style.display = "none";
        nextBtn.style.display = "none";
        optionsContainer.innerHTML = "";
        dynBox.style.display = "none";

        const currentData = quizData[currentQuestionIndex];

        progressEl.innerText = `Question ${currentQuestionIndex + 1} of ${quizData.length}`;
        quizImgEl.src = currentData.imageUrl;
        questionTextEl.innerText = currentData.question;

        currentData.options.forEach((option, index) => {
            const button = document.createElement("button");
            button.classList.add("option-btn");
            button.innerText = option;
            button.onclick = () => selectOption(index);
            optionsContainer.appendChild(button);
        });
    }

    function selectOption(selectedIndex) {
        const currentData = quizData[currentQuestionIndex];
        const buttons = optionsContainer.getElementsByClassName("option-btn");

        for (let i = 0; i < buttons.length; i++) {
            buttons[i].disabled = true;
            if (i === currentData.correct) {
                buttons[i].classList.add("correct");
            }
        }

        if (selectedIndex === currentData.correct) {
            feedbackTitle.innerText = "✓ Correct!";
            feedbackBox.className = "feedback-box correct-style";
        } else {
            buttons[selectedIndex].classList.add("wrong");
            feedbackTitle.innerText = "✗ Wrong Answer";
            feedbackBox.className = "feedback-box wrong-style";
        }

        explanationText.innerText = currentData.explanation;

        if(currentData.dyn) {
            dynBox.innerText = `Did You Know? ${currentData.dyn}`;
            dynBox.style.display = "block";
        }

        feedbackBox.style.display = "block";
        
        if (currentQuestionIndex < quizData.length - 1) {
            nextBtn.innerText = "Next Question →";
        } else {
            nextBtn.innerText = "Restart Quiz ↺";
        }
        nextBtn.style.display = "block";
    }

    function nextQuestion() {
        if (currentQuestionIndex < quizData.length - 1) {
            currentQuestionIndex++;
            loadQuestion();
        } else {
            currentQuestionIndex = 0;
            loadQuestion();
        }
    }

    loadQuestion();
</script>

</body>
</html>
