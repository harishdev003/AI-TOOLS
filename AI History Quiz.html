<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI History Quiz</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body{background:linear-gradient(135deg,#0f172a,#1e3a8a);font-family:Arial;color:#222}
.container{max-width:900px}.hero{color:#fff;text-align:center;padding:30px}
.card{border:none;border-radius:18px;box-shadow:0 10px 25px rgba(0,0,0,.15);margin-bottom:20px}
.btn-primary{border-radius:30px}.correct{color:#198754;font-weight:bold}.wrong{color:#dc3545;font-weight:bold}
</style></head><body><div class="container"><div class="hero"><h1>History of Artificial Intelligence</h1><p>Interactive Quiz</p></div><div id=q></div></div>
<script>
const qs=[
["Who proposed the Turing Test?",["John McCarthy","Alan Turing","Claude Shannon","Marvin Minsky"],1],
["Dartmouth Workshop year?",["1945","1950","1956","1966"],2],
["Who coined Artificial Intelligence?",["Alan Turing","John McCarthy","Herbert Simon","Allen Newell"],1],
["ELIZA was a?",["Robot","Search Engine","Chatbot","Database"],2],
["Reason for First AI Winter?",["Hardware limitations","Internet","Viruses","Cloud"],0],
["MYCIN was an?",["Game","Expert System","Robot","Language"],1],
["Who defeated Garry Kasparov?",["Watson","Deep Blue","AlphaGo","GPT"],1],
["2012 Deep Learning breakthrough?",["Transformer","AlexNet","BERT","LSTM"],1],
["Who defeated Lee Sedol?",["Deep Blue","AlphaGo","Claude","Gemini"],1],
["Modern LLMs are powered by?",["CNN","Transformer","Decision Tree","Rule Engine"],1]
];
let h="";
qs.forEach((x,i)=>{h+=`<div class=card><div class='card-body'><h5>${i+1}. ${x[0]}</h5>${x[1].map((o,j)=>`<div class=form-check><input class=form-check-input type=radio name=q${i} value=${j}><label class=form-check-label>${o}</label></div>`).join("")}<button class='btn btn-primary mt-3' onclick='c(${i})'>Check Answer</button><div id=r${i} class='mt-2'></div></div></div>`});q.innerHTML=h;
function c(i){let s=document.querySelector(`input[name=q${i}]:checked`);let r=document.getElementById("r"+i);if(!s){r.innerHTML="<span class=text-warning>Select an option.</span>";return;}if(+s.value===qs[i][2])r.innerHTML="<span class=correct>✔ Correct!</span>";else r.innerHTML=`<span class=wrong>✘ Incorrect. Correct Answer: <b>${qs[i][1][qs[i][2]]}</b></span>`;}
</script></body></html>
